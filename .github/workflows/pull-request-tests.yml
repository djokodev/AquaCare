name: Pull Request Tests

on:
  pull_request:
    branches:
      - develop

# Permissions minimales pour tests uniquement
permissions:
  contents: read
  pull-requests: write

jobs:
  python-code-style:
    name: Python Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Ruff Module Scope
        run: |
          ruff check backend/manage.py backend/apps backend/aquacare_api backend/tests

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Backend Tests with Coverage
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: aquacare_api.settings.test
        run: |
          pytest --cov=apps --cov-report=term --cov-report=xml --cov-fail-under=50 -v

      - name: Upload Backend Coverage Report
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false


  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests with Coverage
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false --passWithNoTests

      - name: Upload Frontend Coverage Report
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false


  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Compiler Check
        working-directory: ./frontend
        run: npx tsc --noEmit

  postgresql-transactional-launch:
    name: PostgreSQL Transactional Launch and Calibration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: aquacare_ci
          POSTGRES_USER: aquacare
          POSTGRES_PASSWORD: aquacare
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aquacare -d aquacare_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Apply PostgreSQL migrations
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: aquacare_api.settings.development
          POSTGRES_DB: aquacare_ci
          POSTGRES_USER: aquacare
          POSTGRES_PASSWORD: aquacare
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_CACHE_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: python manage.py migrate --noinput

      - name: Run PostgreSQL Lot 2A projection contract
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: aquacare_api.settings.postgres_test
          PGTEST_DB: aquacare_ci
          PGTEST_USER: aquacare
          PGTEST_PASSWORD: aquacare
          PGTEST_HOST: 127.0.0.1
          PGTEST_PORT: 5432
          PGTEST_DATABASE_NAME: test_aquacare_lot_2a
          REDIS_CACHE_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: |
          lot_2a_output="$(pytest -n 0 \
            tests/test_admin_activity_projection.py \
            tests/test_admin_activity_projection_postgresql.py \
            -q)"
          echo "$lot_2a_output"
          if echo "$lot_2a_output" | grep -qi skipped; then
            echo "PostgreSQL Lot 2A tests must not be skipped"
            exit 1
          fi

      - name: Run PostgreSQL transactional launch tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: aquacare_api.settings.development
          POSTGRES_DB: aquacare_ci
          POSTGRES_USER: aquacare
          POSTGRES_PASSWORD: aquacare
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_CACHE_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: |
          pytest -n 0 apps/aquaculture/tests/test_cycle_launch.py -q
          concurrency_output="$(pytest -n 0 apps/aquaculture/tests/test_cycle_launch.py -q -k 'concurrent_identical_launches_create_one_aggregate or concurrent_different_launches_reserve_one_existing_unit')"
          echo "$concurrency_output"
          if echo "$concurrency_output" | grep -qi skipped; then
            echo "Concurrent PostgreSQL launch test was skipped"
            exit 1
          fi
          calibration_output="$(pytest -n 0 apps/aquaculture/tests/services/test_calibration_service.py -q -k 'concurrent_ or concurrent_global_harvest_and_calibration')"
          echo "$calibration_output"
          if echo "$calibration_output" | grep -qi skipped; then
            echo "Concurrent PostgreSQL calibration test was skipped"
            exit 1
          fi
          name_output="$(pytest -n 0 \
            apps/aquaculture/tests/test_production_unit_concurrency.py \
            apps/aquaculture/tests/test_concurrent_name_api.py \
            apps/aquaculture/tests/test_cycle_launch.py \
            -q -k 'concurrent_name')"
          echo "$name_output"
          if echo "$name_output" | grep -qi skipped; then
            echo "Concurrent PostgreSQL name collision test was skipped"
            exit 1
          fi
          harvest_output="$(pytest -n 0 \
            apps/aquaculture/tests/services/test_calibration_service.py \
            apps/aquaculture/tests/services/test_sync_service.py \
            -q -k 'final_harvest_pending or pending_harvest or final_harvest_idempotency or invalidating_final_harvest or full_sync_orders_calibration_before_final_harvest or full_sync_rejects_calibration_exactly_at_final_harvest or delta_sync_exposes_pending_harvest or full_sync_rejects_naive_datetime')"
          echo "$harvest_output"
          if echo "$harvest_output" | grep -qi skipped; then
            echo "Critical final-harvest reconciliation test was skipped"
            exit 1
          fi
          global_harvest_output="$(pytest -n 0 \
            apps/aquaculture/tests/test_views.py \
            apps/aquaculture/tests/services/test_sync_service.py \
            -q -k 'global_harvest_retry_returns_pending_operation or global_harvest_multi_allocation_returns_all_operations or global_harvest_child_operation_references or full_sync_partial_success_lists_only_accepted_business_items')"
          echo "$global_harvest_output"
          if echo "$global_harvest_output" | grep -qi skipped; then
            echo "Critical global-harvest test was skipped"
            exit 1
          fi
          retry_output="$(pytest -n 0 \
            apps/aquaculture/tests/test_views.py \
            apps/aquaculture/tests/services/test_sync_service.py \
            -q -k 'online_then_offline_retry or partial_success_confirms_all_accepted_collections or global_harvest_child_operation_references')"
          echo "$retry_output"
          if echo "$retry_output" | grep -qi skipped; then
            echo "Critical harvest retry, concurrency, partial-success, or child-reference test was skipped"
            exit 1
          fi

      - name: Run PostgreSQL feed ledger and migration tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: aquacare_api.settings.development
          POSTGRES_DB: aquacare_ci
          POSTGRES_USER: aquacare
          POSTGRES_PASSWORD: aquacare
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_CACHE_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: |
          feed_output="$(pytest -n 0 \
            apps/aquaculture/tests/test_feed_reference_migrations.py \
            apps/aquaculture/tests/services/test_feed_stock_transactions.py \
            apps/aquaculture/tests/test_feed_recommendations.py \
            -q)"
          echo "$feed_output"
          if echo "$feed_output" | grep -qi skipped; then
            echo "PostgreSQL feed ledger, migration, and progression tests must not be skipped"
            exit 1
          fi

      - name: Run PostgreSQL report scope tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: aquacare_api.settings.development
          POSTGRES_DB: aquacare_ci
          POSTGRES_USER: aquacare
          POSTGRES_PASSWORD: aquacare
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_CACHE_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libglib2.0-0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0
          report_output="$(pytest -n 0 \
            apps/aquaculture/tests/test_reports.py \
            apps/aquaculture/tests/services/test_report_service.py \
            apps/aquaculture/tests/services/test_report_application_service.py -q)"
          echo "$report_output"
          if echo "$report_output" | grep -qi skipped; then
            echo "PostgreSQL report tests must not be skipped"
            exit 1
          fi


  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [python-code-style, backend-tests, frontend-tests, typescript-check, postgresql-transactional-launch]
    if: always()

    steps:
      - name: Check All Jobs Status
        run: |
          if [[ "${{ needs.python-code-style.result }}" != "success" ]] || \
             [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.typescript-check.result }}" != "success" ]] || \
             [[ "${{ needs.postgresql-transactional-launch.result }}" != "success" ]]; then
            echo "❌ Some checks failed!"
            exit 1
          fi
          echo "✅ All checks passed successfully!"
