# Docker DNS must be resolved at request time because Dokploy can recreate the
# API container with a new IP during a rollout while keeping the same service
# name. Without this, nginx can keep proxying to a stale container IP and
# return 502 until it is restarted manually.
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name 77.237.241.223;  # IP VPS Contabo
    client_max_body_size 20M;    # Limite upload (photos journal sanitaire)

    # Gzip compression — reduces JSON response size 60-80% (critical for 2G/3G)
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        charset utf-8;
        charset_types application/javascript text/javascript text/css;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /health/ {
        set $django_upstream http://api:8000;
        proxy_pass $django_upstream/api/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        access_log off;
    }

    location / {
        set $django_upstream http://api:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts (zones rurales Cameroun)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
