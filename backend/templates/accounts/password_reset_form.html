{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaCare — {{ texts.title }}</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
    }
    .card {
      width: 100%;
      max-width: 420px;
      margin: 24px;
      padding: 32px 28px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-name { font-size: 18px; font-weight: 700; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .intro { color: #475569; font-size: 14px; margin: 0 0 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }
    input[type="password"]:focus {
      outline: 2px solid #2563eb;
      border-color: #2563eb;
    }
    button {
      margin-top: 22px;
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .error {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 14px;
    }
    .invalid {
      padding: 12px 14px;
      border-radius: 10px;
      background: #fffbeb;
      color: #92400e;
      font-size: 14px;
    }
    .hint { color: #94a3b8; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-badge">A</div>
      <div class="brand-name">AquaCare</div>
    </div>

    <h1>{{ texts.title }}</h1>

    {% if invalid_link %}
      <p class="invalid">{{ texts.invalid_link }}</p>
    {% else %}
      <p class="intro">{{ texts.intro }}</p>

      {% if error_message %}
        <p class="invalid">{{ error_message }}</p>
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}
        <label for="id_password">{{ texts.password_label }}</label>
        <input type="password" id="id_password" name="password" required minlength="8" autocomplete="new-password" />

        <label for="id_password_confirm">{{ texts.password_confirm_label }}</label>
        <input type="password" id="id_password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password" />

        <button type="submit">{{ texts.submit }}</button>
      </form>

      <p class="hint">AquaCare · {{ texts.intro }}</p>
    {% endif %}
  </main>
</body>
</html>
