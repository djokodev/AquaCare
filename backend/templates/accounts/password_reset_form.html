{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaCare — {{ texts.title }}</title>
  <style>
    :root {
      --brand: #059669;
      --brand-dark: #047857;
      --brand-subtle: #ecfdf5;
      --page: #f8fafc;
      --card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border: #d1d5db;
      --error: #dc2626;
      --error-surface: #fef2f2;
      --warning: #b45309;
      --warning-surface: #fffbeb;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px; }
    .brand img { width: 104px; height: auto; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: var(--brand-dark); }
    h1 { font-size: 21px; line-height: 1.25; margin: 0 0 8px; text-align: center; }
    .intro { color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin: 0 0 22px; text-align: center; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--text-primary); }
    input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-primary);
      background: var(--card);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }
    button {
      margin-top: 24px;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: var(--brand);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--brand-dark); }
    .alert {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
    }
    .alert-error { background: var(--error-surface); color: var(--error); }
    .alert-warning { background: var(--warning-surface); color: var(--warning); }
    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="{% static 'brand/aquacare-logo.png' %}" alt="AquaCare" />
      <span class="brand-name">AquaCare</span>
    </div>

    {% if invalid_link %}
      <h1>{{ texts.title }}</h1>
      <p class="alert alert-warning">{{ texts.invalid_link }}</p>
    {% else %}
      <h1>{{ texts.title }}</h1>
      <p class="intro">{{ texts.intro }}</p>

      {% if error_message %}
        <p class="alert alert-error">{{ error_message }}</p>
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}
        <label for="id_password">{{ texts.password_label }}</label>
        <input type="password" id="id_password" name="password" required minlength="8" autocomplete="new-password" />

        <label for="id_password_confirm">{{ texts.password_confirm_label }}</label>
        <input type="password" id="id_password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password" />

        <button type="submit">{{ texts.submit }}</button>
      </form>
    {% endif %}

    <p class="footer">{{ texts.footer }}</p>
  </main>
</body>
</html>
