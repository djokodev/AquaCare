{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaCare — {{ texts.success_title }}</title>
  <style>
    :root {
      --brand: #059669;
      --brand-dark: #047857;
      --brand-subtle: #ecfdf5;
      --page: #f8fafc;
      --card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
      text-align: center;
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
    .brand img { width: 104px; height: auto; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: var(--brand-dark); }
    .badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--brand-subtle);
      color: var(--brand);
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }
    h1 { font-size: 21px; margin: 0 0 10px; }
    p { color: var(--text-secondary); font-size: 15px; line-height: 1.5; margin: 0; }
    .footer { margin-top: 22px; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="{% static 'brand/aquacare-logo.png' %}" alt="AquaCare" />
      <span class="brand-name">AquaCare</span>
    </div>

    <div class="badge">&#10003;</div>
    <h1>{{ texts.success_title }}</h1>
    <p>{{ texts.success_intro }}</p>
    <p class="footer">{{ texts.footer }}</p>
  </main>
</body>
</html>
