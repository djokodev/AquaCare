<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaCare — {{ texts.success_title }}</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
    }
    .card {
      width: 100%;
      max-width: 420px;
      margin: 24px;
      padding: 32px 28px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
      text-align: center;
    }
    .badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dcfce7;
      color: #15803d;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #475569; font-size: 15px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">&#10003;</div>
    <h1>{{ texts.success_title }}</h1>
    <p>{{ texts.success_intro }}</p>
  </main>
</body>
</html>
