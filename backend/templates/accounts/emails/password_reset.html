{% load static %}<!DOCTYPE html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ texts.title }}</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1e293b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;">
          <tr>
            <td align="center" style="padding:28px 28px 8px;">
              <img src="{{ logo_url }}" alt="AquaCare" width="104" style="display:block;width:104px;height:auto;" />
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 0;">
              <h1 style="margin:0 0 10px;font-size:20px;line-height:1.3;text-align:center;color:#1e293b;">{{ texts.title }}</h1>
              <p style="margin:0 0 18px;font-size:14px;line-height:1.5;text-align:center;color:#475569;">{{ texts.intro }}</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px;">
              <a href="{{ reset_link }}" style="display:inline-block;padding:14px 22px;border-radius:12px;background:#059669;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">{{ texts.cta }}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px 0;">
              <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#64748b;text-align:center;">{{ texts.expiry }}</p>
              <p style="margin:0;font-size:12px;line-height:1.5;color:#94a3b8;text-align:center;word-break:break-all;">{{ reset_link }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px 28px;">
              <p style="margin:0;font-size:13px;line-height:1.55;color:#64748b;">{{ texts.ignore }}</p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:12px;color:#94a3b8;">{{ texts.team }}</p>
      </td>
    </tr>
  </table>
</body>
</html>
