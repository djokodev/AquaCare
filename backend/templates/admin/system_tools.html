{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div data-admin-i18n-native class="aquacare-system-tools">
    <div class="row">
        {% for tool in tools %}
        <div class="col-lg-4 col-md-6 col-12">
            <a class="info-box aquacare-dashboard-card" href="{% url tool.url %}">
                <span class="info-box-icon bg-secondary"><i class="fas fa-cog" aria-hidden="true"></i></span>
                <span class="info-box-content">
                    <span class="info-box-text">{{ tool.label }}</span>
                    <small>{{ tool.app_label }}</small>
                </span>
            </a>
        </div>
        {% empty %}
        <div class="col-12"><p>{% translate "Aucun outil technique enregistre." %}</p></div>
        {% endfor %}
    </div>
</div>
{% endblock %}
